name: Build web image

# 自有分支 custom 的前端镜像：推送后测试、编译并发布到 GHCR。
# 独立文件，不修改上游 workflow，合并上游时不会冲突。

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ppanel-web

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: bun run test

  publish:
    name: Publish web image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build metadata
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 构建期变量（API 前缀、节点安装脚本地址）会被内联进静态页。
      # VITE_NODE_INSTALL_SCRIPT_URL 可在仓库 Variables 里配置，留空则回退到上游脚本。
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_PREFIX=/api
            VITE_NODE_INSTALL_SCRIPT_URL=${{ vars.VITE_NODE_INSTALL_SCRIPT_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:custom
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:custom-${{ env.SHORT_SHA }}
